<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alencar e Sociedade</title>
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<header class="site-header">
  <div class="wrap site-header__inner">
    <a href="index.html" class="logo">Alencar e Sociedade</a>
    <nav class="nav">
      <a href="index.html">Início</a>
      <a href="sobre.html">Sobre</a>
    </nav>
  </div>
</header>

<div class="wave" aria-hidden="true">
  <svg viewBox="0 0 1200 60" preserveAspectRatio="none">
    <path d="M0,30 C200,60 400,0 600,30 C800,60 1000,0 1200,30 L1200,60 L0,60 Z" fill="var(--amber)"/>
  </svg>
</div>


<main class="wrap">

  

  <section class="grid" aria-label="Matérias recentes">
    
  </section>

  <section class="search" aria-label="Buscar matérias">
    <h2 class="search__title">Buscar por palavra-chave</h2>
    <input type="search" id="busca" class="search__input" placeholder="ex.: Gramsci, cidade, mérito...">
    <ul id="resultados-busca" class="search__resultados"></ul>
  </section>

</main>


<div class="wave wave--footer" aria-hidden="true">
  <svg viewBox="0 0 1200 60" preserveAspectRatio="none">
    <path d="M0,20 C200,50 400,0 600,20 C800,50 1000,0 1200,20 L1200,60 L0,60 Z" fill="var(--petrol)" opacity="0.4"/>
    <path d="M0,35 C200,10 400,60 600,35 C800,10 1000,60 1200,35 L1200,60 L0,60 Z" fill="var(--amber)"/>
  </svg>
</div>

<footer class="site-footer">
  <div class="wrap">
    <p>Alencar e Sociedade — ciências sociais, teoria política e cotidiano.</p>
  </div>
</footer>


<script src="js/busca.js" data-index="search-index.json"></script>


</body>
</html>
