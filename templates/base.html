<!DOCTYPE html>
<html lang="{{ html_lang|default('pt-BR') }}">
<head>
<link rel="icon" href="{{ base_path }}favicon.ico" sizes="32x32">
<link rel="icon" href="{{ base_path }}favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ base_path }}apple-touch-icon.png">
<meta property="og:type" content="{{ 'article' if slug is defined else 'website' }}">
<meta property="og:site_name" content="Alencar e Sociedade">
<meta property="og:title" content="{{ title|e }}">
<meta property="og:description" content="{{ (resumo or 'Ciências sociais, política e sociedade.')|e }}">
<meta property="og:url" content="{{ og_url }}">
<meta property="og:image" content="{{ og_image }}">
<meta property="og:locale" content="pt_BR">
<meta name="twitter:card" content="summary_large_image">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ title }}</title>
<link rel="stylesheet" href="{{ base_path }}css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<header class="site-header">
  <div class="wrap site-header__inner">
    <a href="{{ base_path }}index.html" class="logo">Alencar e Sociedade</a>
    <nav class="nav">
      <a href="{{ base_path }}index.html">Início</a>
      <a href="{{ base_path }}sobre.html">Sobre</a>
      <a href="{{ base_path }}links.html">Links</a>
    </nav>
  </div>
</header>

<div class="wave" aria-hidden="true">
  <svg viewBox="0 0 1200 60" preserveAspectRatio="none">
    <path d="M0,30 C200,60 400,0 600,30 C800,60 1000,0 1200,30 L1200,60 L0,60 Z" fill="var(--amber)"/>
  </svg>
</div>

{% block content %}{% endblock %}

<div class="wave wave--footer" aria-hidden="true">
  <svg viewBox="0 0 1200 60" preserveAspectRatio="none">
    <path d="M0,20 C200,50 400,0 600,20 C800,50 1000,0 1200,20 L1200,60 L0,60 Z" fill="var(--petrol)" opacity="0.4"/>
    <path d="M0,35 C200,10 400,60 600,35 C800,10 1000,60 1200,35 L1200,60 L0,60 Z" fill="var(--amber)"/>
  </svg>
</div>

<footer class="site-footer">
  <div class="wrap">
    <p>Alencar e Sociedade — ciências sociais, teoria política e cotidiano.</p>
  </div>
</footer>

{% block scripts %}{% endblock %}

</body>
</html>
